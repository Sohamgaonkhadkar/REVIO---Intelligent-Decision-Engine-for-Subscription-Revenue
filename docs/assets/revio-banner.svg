<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">REVIO — Intelligent Revenue Recovery</title>
  <desc id="desc">A luminous blue banner showing a recovery path through rules, probability, value and evidence. Built for simulated subscription payment recovery.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2=".6"><stop stop-color="#f6fbff"/><stop offset=".6" stop-color="#e2f3ff"/><stop offset="1" stop-color="#c6eaff"/></linearGradient>
    <linearGradient id="path" x2="1"><stop stop-color="#72c9fb"/><stop offset="1" stop-color="#1670ed"/></linearGradient>
    <radialGradient id="light"><stop stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" fill="none" stroke="#2587d7" stroke-opacity=".08"/></pattern>
  </defs>
  <rect width="1280" height="340" rx="24" fill="url(#background)"/>
  <rect width="1280" height="340" rx="24" fill="url(#grid)"/>
  <ellipse cx="780" cy="20" rx="520" ry="300" fill="url(#light)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
    <rect x="48" y="38" width="238" height="28" rx="14" fill="#fff" fill-opacity=".75" stroke="#b9dcf7"/>
    <circle cx="64" cy="52" r="4" fill="#e9a44b"/>
    <text x="78" y="57" font-size="11" font-weight="700" letter-spacing="1.5" fill="#315e7c">SUBSCRIPTION INTELLIGENCE</text>
    <text x="46" y="154" font-size="82" font-weight="750" letter-spacing="-4" fill="#103551">REVIO<tspan fill="#148fe0">.</tspan></text>
    <text x="50" y="194" font-size="25" font-weight="600" letter-spacing="-.5" fill="#214c6a">Every recovery starts with a better decision.</text>
    <text x="50" y="232" font-size="15" fill="#547b96">Rules first. Probability next. Value before execution.</text>
    <text x="50" y="296" font-size="11" font-weight="600" letter-spacing="1.8" fill="#567e9b">UPI AUTOPAY  /  CARD SI  /  SIMULATED EVIDENCE</text>
    <g transform="translate(770 70)">
      <rect width="456" height="218" rx="22" fill="#fff" fill-opacity=".62" stroke="#b2d9f6"/>
      <text x="24" y="35" font-size="10" font-weight="700" letter-spacing="2" fill="#5882a0">THE RECOVERY PATH</text>
      <path d="M42 100H142Q162 100 162 120V148Q162 166 182 166H286Q306 166 306 146V120Q306 100 326 100H414" fill="none" stroke="#b7def8" stroke-width="14"/>
      <path d="M42 100H142Q162 100 162 120V148Q162 166 182 166H286Q306 166 306 146V120Q306 100 326 100H414" fill="none" stroke="url(#path)" stroke-width="3"/>
      <g fill="#fff" stroke="#6ab7f1" stroke-width="2"><circle cx="48" cy="100" r="12"/><circle cx="162" cy="139" r="12"/><circle cx="278" cy="166" r="12"/><circle cx="406" cy="100" r="12"/></g>
      <g fill="#2186dd"><circle cx="48" cy="100" r="4"/><circle cx="162" cy="139" r="4"/><circle cx="278" cy="166" r="4"/></g>
      <path d="m400 100 4 4 8-9" fill="none" stroke="#179c80" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <g font-size="10" font-weight="700" letter-spacing=".8" fill="#3b6685" text-anchor="middle"><text x="48" y="76">RULES</text><text x="162" y="113">PREDICT</text><text x="278" y="199">VALUE</text><text x="398" y="76">EVIDENCE</text></g>
    </g>
  </g>
</svg>
