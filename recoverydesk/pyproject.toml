[project]
name = "recoverydesk"
version = "0.1.0"
description = "RecoveryDesk — AI revenue recovery platform for Indian subscription businesses (SIM/SBX zones)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pyyaml>=6.0",
  "numpy>=1.26",
  "xgboost>=2.1",
  "joblib>=1.3",
  "httpx>=0.27",
  "psycopg[binary]>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "pyarrow>=15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
