<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/revio.svg" />
    <link
      rel="preload"
      as="image"
      href="/images/recovery-workspace.jpg"
      fetchpriority="high"
    />
    <meta name="theme-color" content="#2563FF" />
    <meta
      name="description"
      content="REVIO turns failed Indian recurring payments into constrained, economically ranked recovery decisions inside a softly luminous, synthetic revenue intelligence workspace."
    />
    <title>REVIO | Revenue, Back in Motion</title>
    <script>
      try {
        document.documentElement.dataset.theme =
          JSON.parse(localStorage.getItem("revio-blue-theme")) === "dark"
            ? "dark"
            : "light";
      } catch (_) {}
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
