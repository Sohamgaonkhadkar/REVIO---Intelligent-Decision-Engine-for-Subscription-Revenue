# rule pack: upi_autopay v1 — the compiled authority for UPI AutoPay cases.
# The constraint engine loads this (versioned, content-hashed). RAG text can
# never override it (PHASE_4 §16.2 authority law).
pack_id: upi_autopay
version: 1
rail: upi_autopay
tz: Asia/Kolkata

budgets:
  retry:                      # R-BUDGET-RETRY-1P3
    max_retries: 3            # original + ≤3 (FACT, NPCI 1+3)
    rule_id: R-BUDGET-RETRY-1P3
  contacts:                   # R-CONTACT-CAP-2 / R-COOLDOWN-20H
    max_contacts: 2
    cooldown_hours: 20
    rule_id: R-CONTACT-CAP-2

windows:
  quiet_hours: "21:00-08:00"  # R-QUIET-HOURS-2108
  legal_execution: "08:00-21:00"
  contact_hours: "09:00-21:00"
  bins: [W08_11, W11_14, W14_17, W17_21]
  window_rule_id: R-WINDOW-LEGAL

class_eligibility:            # R-CLASS-RETRY-ELIGIBLE
  non_retryable: [MANDATE_PAUSED, MANDATE_CLOSED, CARD_EXPIRED, CARD_LOST_STOLEN, UNMAPPED]
  pm_update_classes: [MANDATE_CLOSED, CARD_EXPIRED, CARD_LOST_STOLEN]
  unmapped_policy: non_retryable     # fail closed

mandate:                      # R-MANDATE-ACTIVE
  retry_requires: [active]

amount:                       # R-AMOUNT-CAP-15K
  max_auto_amount_inr: 15000

state_rules:                  # R-TERMINAL-ABSORB / R-OPTOUT / R-KILL-SCOPE
  terminal_absorbing: true
  opt_out_blocks_contact: true
  kill_scopes: [global, merchant, rail, rule_pack, case]

stop_escalate:
  horizon_hours: 336          # R-HORIZON-336H
  unresponsive_nudges_before_mandate_dead: 2
